fastapi-mail = "1.2.7"
jinja2 = "3.1.2"
passlib = "1.7.4"
pydantic = "1.10.7"
python-dotenv = "1.0.0"
python-jose = "3.3.0"
python-multipart = "0.0.6"
redis = "4.5.4"
sqlalchemy = "2.0.7"
starlette = "0.26.1"
uvicorn = "0.21.1"
psycopg2-binary = "2.9.9"
pytz = "^2024.1"
opencv-python = "4.9.0.80"
numpy = "1.26.4"
