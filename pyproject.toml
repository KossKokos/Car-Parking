[tool.poetry]
name = "car-parking"
version = "0.1.0"
description = ""
authors = ["KossKokos <koskokos0@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.8"
alembic = "1.10.2"
bcrypt = "4.0.1"
cryptography = "41.0.5"
fastapi = "0.95.0"
email-validator = "1.3.1"
