[tool.poetry]
name = "uk-plate-recognition"
version = "0.1.0"
description = "Runtime UK license plate recognition package"
authors = ["KossKokos <koskokos0@gmail.com>"]
packages = [
    { include = "anpr", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
torch = ">=2.2,<3.0"
numpy = "1.26.4"
opencv-python = "4.9.0.80"
onnxruntime = "1.23.2"
open-image-models = "0.5.1"

[tool.poetry.group.scraping]
optional = true

[tool.poetry.group.scraping.dependencies]
playwright = ">=1.45,<2.0"
httpx = ">=0.27,<1.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.group.training]
optional = true

[tool.poetry.group.training.dependencies]
pandas = ">=2.2,<3.0"
scikit-learn = ">=1.5,<2.0"
albumentations = ">=2.0,<3.0"
Pillow = ">=10.0,<12.0"
matplotlib = ">=3.8,<4.0"
jupyterlab = ">=4.0,<5.0"
ipykernel = ">=6.29,<7.0"
tqdm = ">=4.66,<5.0"
PyYAML = ">=6.0,<7.0"
rich = ">=13.7,<15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"